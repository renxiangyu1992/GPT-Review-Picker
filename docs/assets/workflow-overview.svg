<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Execute, handoff, and independent review</title>
  <desc id="desc">Codex or an agent completes a task, GPT Review Picker receives the result and evidence, and the user chooses what an independent reviewer sees.</desc>
  <rect width="1200" height="360" rx="24" fill="#f6f8fa"/>
  <text x="600" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1f2328">Executor ≠ Reviewer</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="54" y="82" width="320" height="196" rx="18" fill="#ffffff" stroke="#afb8c1" stroke-width="2"/>
    <circle cx="96" cy="122" r="22" fill="#0969da"/>
    <text x="96" y="129" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">01</text>
    <text x="132" y="130" font-size="22" font-weight="700" fill="#0969da" letter-spacing="1">EXECUTE</text>
    <text x="84" y="184" font-size="18" font-weight="600" fill="#1f2328">Codex / Agent</text>
    <text x="84" y="215" font-size="17" fill="#57606a">completes the task</text>
    <text x="84" y="245" font-size="15" fill="#6e7781">The result is finished first.</text>

    <path d="M390 180 H426" stroke="#57606a" stroke-width="4" stroke-linecap="round"/>
    <path d="M419 170 L431 180 L419 190" fill="none" stroke="#57606a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="440" y="82" width="320" height="196" rx="18" fill="#ffffff" stroke="#afb8c1" stroke-width="2"/>
    <circle cx="482" cy="122" r="22" fill="#1a7f37"/>
    <text x="482" y="129" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">02</text>
    <text x="518" y="130" font-size="22" font-weight="700" fill="#1a7f37" letter-spacing="1">HANDOFF</text>
    <text x="470" y="184" font-size="18" font-weight="600" fill="#1f2328">GPT Review Picker</text>
    <text x="470" y="215" font-size="17" fill="#57606a">receives result + evidence</text>
    <text x="470" y="245" font-size="15" fill="#6e7781">Nothing is judged here.</text>

    <path d="M776 180 H812" stroke="#57606a" stroke-width="4" stroke-linecap="round"/>
    <path d="M805 170 L817 180 L805 190" fill="none" stroke="#57606a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="826" y="82" width="320" height="196" rx="18" fill="#ffffff" stroke="#afb8c1" stroke-width="2"/>
    <circle cx="868" cy="122" r="22" fill="#8250df"/>
    <text x="868" y="129" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">03</text>
    <text x="904" y="130" font-size="22" font-weight="700" fill="#8250df" letter-spacing="1">REVIEW</text>
    <text x="856" y="184" font-size="18" font-weight="600" fill="#1f2328">You choose what</text>
    <text x="856" y="215" font-size="17" fill="#57606a">an independent Reviewer sees</text>
    <text x="856" y="245" font-size="15" fill="#6e7781">Selection stays human-controlled.</text>

    <text x="600" y="323" text-anchor="middle" font-size="16" fill="#57606a">The Picker carries the result and chosen evidence — it does not judge the work.</text>
  </g>
</svg>
